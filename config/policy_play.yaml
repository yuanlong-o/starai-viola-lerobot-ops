# Direct LeRobot policy play. Change this path to select another compatible
# local policy with the same Viola observation/action features.
policy:
  path: /home/yz/models/act_viola_val20_step080000

robot:
  type: lerobot_robot_viola
  id: my_awesome_staraiviola_arm
  calibration_dir: /home/yz/lerobot/starai-viola-lerobot-ops/calibration/robots/starai_viola
  port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:10:1.0-port0
  disable_torque_on_disconnect: true
  use_degrees: false
  # Both C270s were verified together at 640x480 and 29+ Hz with V4L2/YUYV.
  cameras:
    front:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-046d_0825_543F8BC0-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: YUYV
      backend: 200  # OpenCV CAP_V4L2 on Linux.
      warmup_s: 8
    up:
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-046d_0825_A8E49440-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: YUYV
      backend: 200  # OpenCV CAP_V4L2 on Linux.
      warmup_s: 8

# Base + sync is LeRobot's ordinary autonomous policy-play mode. It does not
# record a dataset and does not use Repo-A/Repo-B handoffs or W&B.
# Policy-specific settings come from the checkpoint (this ACT saves a queue of 100).
strategy:
  type: base
inference:
  type: sync

fps: 30
duration: 10
device: cuda:0
task: Move the blue cube, then the red cube, from the white pad on the right to the gray platform on the left.
display_data: false
play_sounds: false
return_to_initial_position: false
