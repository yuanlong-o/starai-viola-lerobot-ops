[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starai-viola-lerobot-ops"
version = "0.1.0"
description = "PC-A operations and evidence tooling for the StarAI Viola benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "av==15.1.0",
  "huggingface-hub==1.27.0",
  "lerobot==0.6.1",
  "wandb==0.27.2",
]

[project.scripts]
viola-handoff = "viola_handoff.cli:main"
viola-ops = "viola_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lerobot", "lerobot.*", "av", "av.*", "wandb", "wandb.*"]
ignore_missing_imports = true
